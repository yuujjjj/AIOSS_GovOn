[build-system]
requires = ["setuptools>=82.0.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "GovOn"
version = "1.0.1"
description = "Shell-first local agentic runtime for administrative assistance and civil complaint workflows"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "On-Device AI Team", email = "team@example.com"}
]
keywords = [
    "agentic-shell",
    "local-runtime",
    "civil-complaint",
    "korean-nlp",
    "retrieval-augmented-generation",
    "fastapi"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]

dependencies = [
    # Core ML/DL
    "torch>=2.12.0",
    "transformers>=4.57.6",
    "accelerate>=1.13.0",
    "datasets>=4.8.5",

    # Quantization & Optimization
    "bitsandbytes>=0.49.2",
    "optimum>=1.13.0",
    "autoawq>=0.2.9",

    # Fine-tuning
    "peft>=0.19.1",
    "trl>=1.5.1",

    # Data Processing
    "pandas>=2.3.3",
    "numpy>=2.2.6",
    "scikit-learn>=1.7.2",

    # Utilities
    "tqdm>=4.67.3",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "loguru>=0.7.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "pytest-asyncio>=1.4.0",
    "black>=26.5.1",
    "isort>=8.0.1",
    "flake8>=7.3.0",
    "mypy>=2.1.0",
    "pre-commit>=4.6.0",
    "bandit>=1.9.4",
    "safety>=2.3.5",
    "wandb>=0.27.0",
    "sacrebleu>=2.6.0",
    "rouge-score>=0.1.2",
    "bert-score>=0.3.13",
]

korean-nlp = [
    "konlpy>=0.6.0",
    "mecab-python3>=1.0.12",
]

inference = [
    "vllm>=0.21.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.48.0",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=5.5.1",
    "faiss-cpu>=1.14.2",
    "httpx>=0.28.1",
    "langgraph==1.2.2",
    "langgraph-checkpoint==4.1.1",
    "langgraph-checkpoint-sqlite==3.1.0",
    "langchain-core>=1.4.0,<2.0.0",
]

database = [
    "sqlalchemy>=2.0.50",
    "alembic>=1.18.4",
    "psycopg2-binary>=2.9.12",
]

all = [
    "GovOn[dev,korean-nlp,inference,database]",
]

[project.urls]
Homepage = "https://github.com/GovOn-org/GovOn"
Documentation = "https://github.com/GovOn-org/GovOn#readme"
Repository = "https://github.com/GovOn-org/GovOn.git"
Issues = "https://github.com/GovOn-org/GovOn/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.yaml", "*.yml"]

# Black configuration
[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | __pycache__
)/
'''

# isort configuration
[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip_gitignore = true

# pytest configuration
[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --cov=src --cov-report=term-missing"
testpaths = ["tests"]
pythonpath = ["."]

# mypy configuration
[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = [
    "venv",
    ".venv",
    "build",
    "dist",
]

# Coverage configuration
[tool.coverage.run]
source = ["src"]
branch = true
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "src/inference/document_processor.py",
    "src/inference/db/database.py",
    "src/inference/db/alembic/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
