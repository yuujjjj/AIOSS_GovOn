name: Dependabot Auto-Merge

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write
  checks: read

concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge for minor and patch updates
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge "$PR_URL" --auto --squash

      - name: Skip major updates
        if: steps.metadata.outputs.update-type == 'version-update:semver-major'
        run: |
          echo "### Dependabot Auto-Merge" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Major update detected for \`${{ steps.metadata.outputs.dependency-names }}\`." >> "$GITHUB_STEP_SUMMARY"
          echo "Manual review is required." >> "$GITHUB_STEP_SUMMARY"

      - name: Auto-merge summary
        if: always()
        run: |
          echo "### Dependabot Policy" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Ecosystem | \`${{ steps.metadata.outputs.package-ecosystem }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Dependencies | \`${{ steps.metadata.outputs.dependency-names }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Update type | \`${{ steps.metadata.outputs.update-type }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Auto-merge | minor/patch only; major requires manual review |" >> "$GITHUB_STEP_SUMMARY"
