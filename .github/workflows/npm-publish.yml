name: npm Package Publish

on:
  push:
    tags:
      - "frontend-v*"
      - "npm-v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and pack without publishing"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read
  packages: write

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: GovOn/frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js for GitHub Packages
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: GovOn/frontend/package-lock.json
          registry-url: https://npm.pkg.github.com
          scope: "@yuujjjj"

      - name: Install dependencies
        run: npm ci

      - name: Verify package version
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_REF_TYPE: ${{ github.ref_type }}
        run: |
          node - <<'NODE'
          const pkg = require("./package.json");
          if (!pkg.name.startsWith("@yuujjjj/")) {
            throw new Error(`GitHub Packages npm name must be scoped: ${pkg.name}`);
          }
          if (pkg.private) {
            throw new Error("private must be false before npm publish");
          }
          if (process.env.GITHUB_REF_TYPE === "tag") {
            const expected = process.env.GITHUB_REF_NAME
              .replace(/^frontend-v/, "")
              .replace(/^npm-v/, "")
              .replace(/^v/, "");
            if (expected && expected !== pkg.version) {
              throw new Error(`tag version ${expected} does not match package version ${pkg.version}`);
            }
          }
          console.log(`${pkg.name}@${pkg.version}`);
          NODE

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build

      - name: Preview npm package contents
        run: npm pack --dry-run

      - name: Publish to GitHub Packages
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.dry_run != 'true' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm publish

      - name: Publish summary
        if: always()
        run: |
          echo "### npm Package Publish" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Item | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Package | \`$(node -p "require('./package.json').name")\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Version | \`$(node -p "require('./package.json').version")\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Registry | \`https://npm.pkg.github.com\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Dry run | \`${{ github.event.inputs.dry_run || 'false' }}\` |" >> "$GITHUB_STEP_SUMMARY"
