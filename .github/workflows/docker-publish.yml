name: Docker Image Publish

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "GovOn/Dockerfile"
      - "GovOn/.dockerignore"
      - "GovOn/requirements.txt"
      - "GovOn/src/**"
      - "GovOn/agents/**"
      - "GovOn/.github/scripts/smoke_test_container.sh"
      - ".github/workflows/docker-publish.yml"
  workflow_dispatch:
    inputs:
      git_ref:
        description: "Git ref or commit SHA to build"
        required: false
        default: ""

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-push-smoke:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.primary_tag }}
    steps:
      - name: Checkout requested ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.git_ref || github.ref }}

      - name: Lowercase image name
        id: image-name
        run: echo "value=$(echo '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Reclaim runner disk space
        run: bash GovOn/.github/scripts/free_runner_disk_space.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine Docker tags
        id: meta
        run: |
          SHORT_SHA="$(git rev-parse --short HEAD)"
          IMAGE_BASE="${{ env.REGISTRY }}/${{ steps.image-name.outputs.value }}"
          PRIMARY_TAG="${IMAGE_BASE}:sha-${SHORT_SHA}"
          TAGS="${PRIMARY_TAG}"

          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAGS="${TAGS}"$'\n'"${IMAGE_BASE}:${{ github.ref_name }}"
          elif [ "${{ github.ref_name }}" = "main" ]; then
            TAGS="${TAGS}"$'\n'"${IMAGE_BASE}:latest"
          fi

          {
            echo "primary_tag=${PRIMARY_TAG}"
            echo "tags<<EOF"
            echo "${TAGS}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./GovOn
          file: ./GovOn/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Pull pushed image locally
        run: docker pull "${{ steps.meta.outputs.primary_tag }}"

      - name: Verify local container execution
        env:
          HOST_PORT: "18000"
          SKIP_MODEL_LOAD: "true"
          SERVING_PROFILE: "container"
        run: bash GovOn/.github/scripts/smoke_test_container.sh "${{ steps.meta.outputs.primary_tag }}"

      - name: Docker publish summary
        if: always()
        run: |
          echo "### Docker Image Publish" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Item | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Primary image | \`${{ steps.meta.outputs.primary_tag }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Build context | \`./GovOn\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Smoke test | \`GET /health\` in a local Docker container |" >> "$GITHUB_STEP_SUMMARY"
